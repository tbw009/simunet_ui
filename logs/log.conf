{
    "version": 1,
    "disable_existing_loggers": false,
    "formatters":
    {
        "console":
        {
            "format": "%(asctime)s.%(msecs)03d - %(message)s",
            "datefmt":"%Y-%m-%dT%H:%M:%S"
        },
        "simple":
        {
            "format": "%(asctime)s.%(msecs)03d - %(name)s - %(levelname)s - %(message)s",
            "datefmt":"%Y-%m-%dT%H:%M:%S"
        },
        "extra":
        {
            "format":"%(asctime)s.%(msecs)03d - %(name)s - %(filename)s - %(lineno)s - %(funcName)s - %(levelname)s - %(message)s",
            "datefmt":"%Y-%m-%dT%H:%M:%S"
        }
    },
    "handlers":
    {
        "console_handler":
        {
            "class": "logging.StreamHandler",
            "level": "INFO",
            "formatter": "console",
            "stream": "ext://sys.stdout"
        },
        "info_file_handler":
        {
            "class": "logging.FileHandler",
            "level": "INFO",
            "formatter": "simple",
            "filename": "logs/info.log",
            "mode": "w",
            "encoding": "utf8"
        },
        "error_file_handler":
        {
            "class": "logging.FileHandler",
            "level": "ERROR",
            "formatter": "extra",
            "filename": "logs/error.log",
            "mode": "w",
            "encoding": "utf8"
        }
    },
    "loggers":
    {
        "waveform":
        {
            "level": "ERROR",
            "handlers": ["console_handler"],
            "propagate": "no"
        }
    },
    "root":
    {
        "level": "INFO",
        "handlers": ["console_handler", "info_file_handler", "error_file_handler"]
    }
}